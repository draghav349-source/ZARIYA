<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZARIYA — Little things. Big sparkle.</title>
<meta name="description" content="ZARIYA — fashion earrings and gifting jewelry for your moods, your moments, and the people you love. Shop earrings made for everyday, date nights, and 'just because' gifts.">
<meta property="og:title" content="ZARIYA — Little things. Big sparkle.">
<meta property="og:description" content="Earrings made for your mood, your moments & the people you love.">
<meta property="og:type" content="website">
<meta property="og:image" content="">
<link rel="canonical" href="https://myzariya.in/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --ivory:#FAF6F0;
  --ivory-deep:#F3ECE2;
  --card:#FFFDF9;
  --blush:#F0DCD9;
  --blush-deep:#E3C4C0;
  --plum:#3E1220;
  --plum-soft:#5C2233;
  --charcoal:#2A2420;
  --charcoal-soft:#5B534C;
  --gold:#B08D57;
  --gold-light:#D9C4A0;
  --line:rgba(42,36,32,0.12);
  --radius-s:2px;
  --radius-m:3px;
  --shadow-card: 0 1px 2px rgba(42,36,32,0.06);
  --serif:'Fraunces', Georgia, serif;
  --sans:'Manrope', -apple-system, sans-serif;
  --maxw:1320px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--sans);
  background:var(--ivory);
  color:var(--charcoal);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  min-height:100vh;
}
img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
ul{list-style:none;}
input,textarea,select{font-family:inherit; font-size:inherit; color:inherit;}
:focus-visible{outline:2px solid var(--plum); outline-offset:2px;}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px;}
@media(max-width:640px){.wrap{padding:0 18px;}}
.serif{font-family:var(--serif);}
.italic{font-style:italic;}
.eyebrow{font-size:11px; letter-spacing:0.12em; color:var(--charcoal-soft); font-weight:600;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:15px 30px; font-size:13px; font-weight:600; letter-spacing:0.04em;
  border-radius:var(--radius-s); transition:all .35s cubic-bezier(.2,.7,.2,1);
  white-space:nowrap;
}
.btn-primary{background:var(--plum); color:var(--ivory);}
.btn-primary:hover{background:var(--charcoal);}
.btn-outline{background:transparent; color:var(--plum); border:1px solid var(--plum);}
.btn-outline:hover{background:var(--plum); color:var(--ivory);}
.btn-ghost{background:var(--card); color:var(--charcoal); border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--plum);}
.btn-full{width:100%;}
.btn[disabled]{opacity:.45; cursor:not-allowed;}
::selection{background:var(--blush-deep); color:var(--plum);}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}

/* skeleton earring icon used as photo placeholder everywhere */
.ph{
  position:relative; width:100%; aspect-ratio:4/5; overflow:hidden;
  background:linear-gradient(155deg,var(--blush) 0%, var(--ivory-deep) 100%);
  display:flex; align-items:center; justify-content:center;
}
.ph svg{width:34%; height:34%; opacity:.55;}
.ph .ph-label{position:absolute; bottom:10px; left:10px; font-size:9px; letter-spacing:.06em; color:var(--charcoal-soft); background:rgba(255,253,249,.7); padding:3px 7px; border-radius:2px;}

/* ============ HEADER ============ */
header.site{
  position:sticky; top:0; z-index:500;
  background:rgba(250,246,240,0);
  border-bottom:1px solid transparent;
  transition:background .3s ease, border-color .3s ease, backdrop-filter .3s ease;
}
header.site.solid{
  background:rgba(250,246,240,0.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.nav-row{display:flex; align-items:center; justify-content:space-between; padding:20px 0; gap:16px;}
.logo{font-family:var(--serif); font-size:24px; letter-spacing:.02em; font-weight:600; color:var(--plum); position:relative;}
.logo .z-dot{color:var(--gold);}
.nav-center{display:flex; gap:34px; font-size:12.5px; letter-spacing:.05em; font-weight:600;}
.nav-center a{padding:6px 0; position:relative; color:var(--charcoal);}
.nav-center a::after{content:'';position:absolute; left:0; bottom:0; width:0; height:1px; background:var(--plum); transition:width .3s ease;}
.nav-center a:hover::after, .nav-center a.active::after{width:100%;}
.nav-icons{display:flex; align-items:center; gap:18px;}
.icon-btn{position:relative; width:22px; height:22px; display:flex; align-items:center; justify-content:center;}
.icon-btn svg{width:19px; height:19px; stroke:var(--charcoal); fill:none; stroke-width:1.5;}
.badge-count{position:absolute; top:-7px; right:-9px; background:var(--plum); color:var(--ivory); font-size:9.5px; font-weight:700; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
.hamburger{display:none; width:22px; height:16px; flex-direction:column; justify-content:space-between;}
.hamburger span{display:block; height:1.4px; background:var(--charcoal); width:100%;}
@media(max-width:900px){
  .nav-center{display:none;}
  .hamburger{display:flex;}
}
.mobile-menu{position:fixed; inset:0; background:var(--ivory); z-index:900; transform:translateX(100%); transition:transform .4s cubic-bezier(.2,.8,.2,1); padding:26px 22px; overflow-y:auto;}
.mobile-menu.open{transform:translateX(0);}
.mobile-menu-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;}
.mobile-menu a{display:block; font-family:var(--serif); font-size:28px; padding:14px 0; border-bottom:1px solid var(--line);}

/* ============ HERO ============ */
.hero{position:relative; padding:64px 0 0; overflow:hidden;}
.hero-grid{display:grid; grid-template-columns:1.05fr .95fr; align-items:center; gap:40px; min-height:78vh;}
.hero-copy{padding:20px 0;}
.hero-copy .eyebrow{margin-bottom:22px; display:block;}
.hero h1{font-family:var(--serif); font-weight:500; font-size:clamp(42px,6.2vw,84px); line-height:1.02; letter-spacing:-0.01em; color:var(--charcoal);}
.hero h1 em{font-style:italic; color:var(--plum); font-weight:500;}
.hero p{margin-top:26px; font-size:17px; line-height:1.6; color:var(--charcoal-soft); max-width:420px;}
.hero-ctas{margin-top:38px; display:flex; gap:14px; flex-wrap:wrap;}
.hero-visual{position:relative; aspect-ratio:3/4; border-radius:var(--radius-m); overflow:hidden;}
.reveal{opacity:0; transform:translateY(18px); transition:opacity .9s ease, transform .9s cubic-bezier(.2,.7,.2,1);}
.reveal.in{opacity:1; transform:translateY(0);}
@media(max-width:900px){
  .hero{padding-top:20px;}
  .hero-grid{grid-template-columns:1fr; min-height:auto; gap:26px;}
  .hero-visual{order:-1; aspect-ratio:4/5;}
  .hero-copy p{max-width:none;}
}

/* ============ SECTION GENERIC ============ */
section{padding:96px 0;}
@media(max-width:640px){section{padding:60px 0;}}
.section-head{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:44px;}
.section-head h2{font-family:var(--serif); font-weight:500; font-size:clamp(28px,3.4vw,42px); letter-spacing:-.01em;}
.section-head p{color:var(--charcoal-soft); font-size:15px; margin-top:8px; max-width:420px;}
.view-all{font-size:12.5px; font-weight:700; letter-spacing:.04em; border-bottom:1px solid var(--charcoal); padding-bottom:2px; white-space:nowrap;}

/* ============ MOODS ============ */
.moods-strip{display:grid; grid-template-columns:repeat(6,1fr); gap:14px;}
@media(max-width:1000px){.moods-strip{grid-template-columns:repeat(3,1fr);}}
@media(max-width:640px){.moods-strip{grid-template-columns:repeat(2,1fr); gap:10px;}}
.mood-card{position:relative; aspect-ratio:3/4.1; overflow:hidden; border-radius:var(--radius-m); cursor:pointer;}
.mood-card:nth-child(2n){margin-top:26px;}
@media(max-width:640px){.mood-card:nth-child(2n){margin-top:0;}}
.mood-card .ph{height:100%;}
.mood-overlay{position:absolute; inset:0; background:linear-gradient(0deg, rgba(42,36,32,.62) 0%, rgba(42,36,32,0) 46%); display:flex; flex-direction:column; justify-content:flex-end; padding:18px;}
.mood-overlay .mood-title{font-family:var(--serif); font-size:19px; color:#fff; font-style:italic;}
.mood-overlay .mood-sub{font-size:11px; color:rgba(255,255,255,.78); margin-top:5px; line-height:1.4;}
.mood-card:hover .ph{transform:scale(1.04);}
.mood-card .ph{transition:transform .6s cubic-bezier(.2,.7,.2,1);}

/* ============ PRODUCT GRID / CARD ============ */
.product-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:26px 22px;}
@media(max-width:980px){.product-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:640px){.product-grid{grid-template-columns:repeat(2,1fr); gap:20px 12px;}}
.p-card{cursor:pointer;}
.p-card-media{position:relative; overflow:hidden; border-radius:var(--radius-m);}
.p-card-media .ph{transition:opacity .5s ease;}
.p-card-media .ph.alt{position:absolute; inset:0; opacity:0;}
.p-card:hover .ph.alt{opacity:1;}
.p-card-badge{position:absolute; top:10px; left:10px; background:var(--ivory); font-size:9.5px; letter-spacing:.06em; font-weight:700; padding:4px 8px; border-radius:2px; color:var(--plum); z-index:2;}
.p-card-wish{position:absolute; top:8px; right:8px; z-index:3; width:32px; height:32px; border-radius:50%; background:rgba(255,253,249,.88); display:flex; align-items:center; justify-content:center; transition:transform .25s ease;}
.p-card-wish svg{width:15px; height:15px; stroke:var(--plum); fill:none; stroke-width:1.6;}
.p-card-wish.active svg{fill:var(--plum);}
.p-card-wish:hover{transform:scale(1.08);}
.p-card-quickadd{position:absolute; left:8px; right:8px; bottom:8px; z-index:2; background:var(--charcoal); color:var(--ivory); font-size:11px; font-weight:700; letter-spacing:.04em; padding:11px; text-align:center; border-radius:2px; opacity:0; transform:translateY(6px); transition:all .3s ease;}
.p-card:hover .p-card-quickadd{opacity:1; transform:translateY(0);}
@media(max-width:900px){.p-card-quickadd{opacity:1; transform:none; position:static; margin-top:8px; background:var(--card); color:var(--charcoal); border:1px solid var(--line);}}
.p-card-info{margin-top:12px; display:flex; justify-content:space-between; gap:8px;}
.p-card-name{font-size:13.5px; font-weight:600; line-height:1.35;}
.p-card-stars{font-size:10px; color:var(--gold); margin-top:3px; letter-spacing:1px;}
.p-card-price{font-size:13.5px; font-weight:700; white-space:nowrap; text-align:right;}
.p-card-compare{font-size:11.5px; color:var(--charcoal-soft); text-decoration:line-through; font-weight:500; margin-right:5px;}

/* ============ GIFTING ============ */
.gifting-hero{background:var(--plum); color:var(--ivory); border-radius:var(--radius-m); padding:70px 44px; position:relative; overflow:hidden;}
.gifting-hero h2{font-family:var(--serif); font-style:italic; font-weight:400; font-size:clamp(30px,4vw,52px); max-width:520px;}
.gifting-hero p{margin-top:16px; color:rgba(250,246,240,.8); max-width:400px; font-size:15px;}
.gifting-hero .btn-outline{margin-top:30px; border-color:var(--ivory); color:var(--ivory);}
.gifting-hero .btn-outline:hover{background:var(--ivory); color:var(--plum);}
.gifting-cats{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:34px;}
@media(max-width:760px){.gifting-cats{grid-template-columns:1fr;}}
.gcat{position:relative; aspect-ratio:16/10; border-radius:var(--radius-m); overflow:hidden; cursor:pointer;}
.gcat .mood-overlay .mood-title{font-size:16px; font-style:normal; font-weight:700; letter-spacing:.03em; font-family:var(--sans);}

/* ============ COUPLE SECTION ============ */
.couple{display:grid; grid-template-columns:.9fr 1.1fr; gap:50px; align-items:center;}
@media(max-width:860px){.couple{grid-template-columns:1fr; gap:26px;}}
.couple-visual{aspect-ratio:5/4; border-radius:var(--radius-m); overflow:hidden;}
.couple h2{font-family:var(--serif); font-weight:500; font-size:clamp(28px,3.6vw,44px);}
.couple p{margin-top:16px; color:var(--charcoal-soft); font-size:15.5px; max-width:420px; line-height:1.65;}

/* ============ REVIEWS ============ */
.reviews-top{text-align:center; margin-bottom:44px;}
.stars-big{color:var(--gold); font-size:20px; letter-spacing:3px;}
.reviews-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
@media(max-width:760px){.reviews-grid{grid-template-columns:1fr;}}
.review-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); padding:26px;}
.review-card .stars{color:var(--gold); font-size:12px; letter-spacing:2px;}
.review-card p{margin-top:14px; font-size:14.5px; line-height:1.6; font-style:italic; font-family:var(--serif);}
.review-card .who{margin-top:16px; font-size:11.5px; font-weight:700; color:var(--charcoal-soft); letter-spacing:.03em;}

/* ============ INSTAGRAM ============ */
.insta-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
@media(max-width:760px){.insta-grid{grid-template-columns:repeat(3,1fr); gap:8px;}}
.insta-tile{aspect-ratio:1; overflow:hidden; position:relative; cursor:pointer;}
.insta-tile .ph{height:100%; aspect-ratio:auto;}
.insta-tile:hover .ph{transform:scale(1.05);}
.insta-tile .ph{transition:transform .5s ease;}

/* ============ ABOUT TEASER ============ */
.about-teaser{display:grid; grid-template-columns:1fr 1fr; gap:50px; align-items:center;}
@media(max-width:860px){.about-teaser{grid-template-columns:1fr;}}
.about-teaser h2{font-family:var(--serif); font-weight:500; font-style:italic; font-size:clamp(28px,3.6vw,42px);}
.about-teaser p{margin-top:18px; color:var(--charcoal-soft); font-size:15.5px; line-height:1.7; max-width:460px;}
.about-visual{aspect-ratio:4/3; border-radius:var(--radius-m); overflow:hidden;}

/* ============ NEWSLETTER / FOOTER ============ */
footer.site{background:var(--charcoal); color:var(--ivory); padding:70px 0 30px;}
.footer-top{display:grid; grid-template-columns:1.4fr repeat(3,1fr); gap:40px; padding-bottom:50px; border-bottom:1px solid rgba(250,246,240,.14);}
@media(max-width:760px){.footer-top{grid-template-columns:1fr 1fr; row-gap:36px;}}
.footer-brand .logo{color:var(--ivory);}
.footer-brand p{margin-top:14px; font-family:var(--serif); font-style:italic; color:rgba(250,246,240,.7); font-size:15px;}
.footer-col h4{font-size:11px; letter-spacing:.08em; color:var(--gold-light); font-weight:700; margin-bottom:16px;}
.footer-col li{margin-bottom:10px; font-size:13.5px; color:rgba(250,246,240,.82);}
.newsletter-form{display:flex; margin-top:14px; border-bottom:1px solid rgba(250,246,240,.4); max-width:280px;}
.newsletter-form input{background:transparent; border:none; color:var(--ivory); padding:10px 0; flex:1; font-size:13px;}
.newsletter-form input::placeholder{color:rgba(250,246,240,.5);}
.newsletter-form button{font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--gold-light); padding:10px 0;}
.footer-bottom{display:flex; justify-content:space-between; padding-top:26px; font-size:11.5px; color:rgba(250,246,240,.5); flex-wrap:wrap; gap:10px;}

/* ============ CART DRAWER ============ */
.overlay{position:fixed; inset:0; background:rgba(42,36,32,.4); z-index:800; opacity:0; pointer-events:none; transition:opacity .35s ease;}
.overlay.open{opacity:1; pointer-events:auto;}
.drawer{position:fixed; top:0; right:0; height:100%; width:min(440px,92vw); background:var(--ivory); z-index:801; transform:translateX(100%); transition:transform .45s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column;}
.drawer.open{transform:translateX(0);}
.drawer-head{display:flex; justify-content:space-between; align-items:center; padding:22px 24px; border-bottom:1px solid var(--line);}
.drawer-head h3{font-family:var(--serif); font-size:20px;}
.drawer-body{flex:1; overflow-y:auto; padding:20px 24px;}
.cart-line{display:flex; gap:14px; padding:16px 0; border-bottom:1px solid var(--line);}
.cart-line .ph{width:76px; height:92px; aspect-ratio:auto; flex-shrink:0; border-radius:2px;}
.cart-line-info{flex:1; display:flex; flex-direction:column; justify-content:space-between;}
.cart-line-name{font-size:13.5px; font-weight:600;}
.cart-line-meta{font-size:11.5px; color:var(--charcoal-soft); margin-top:3px;}
.cart-line-bottom{display:flex; justify-content:space-between; align-items:center;}
.qty-stepper{display:flex; align-items:center; border:1px solid var(--line); border-radius:2px;}
.qty-stepper button{width:26px; height:26px; font-size:14px;}
.qty-stepper span{width:22px; text-align:center; font-size:12.5px;}
.cart-line-remove{font-size:11px; text-decoration:underline; color:var(--charcoal-soft);}
.drawer-foot{padding:20px 24px 26px; border-top:1px solid var(--line);}
.free-ship-bar{height:4px; background:var(--blush); border-radius:2px; overflow:hidden; margin-bottom:10px;}
.free-ship-bar-fill{height:100%; background:var(--plum); transition:width .5s ease;}
.free-ship-note{font-size:11.5px; color:var(--charcoal-soft); margin-bottom:16px;}
.sum-row{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:8px;}
.sum-row.total{font-weight:700; font-size:15px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}
.empty-state{text-align:center; padding:60px 10px; color:var(--charcoal-soft); font-size:14px;}
.cart-upsell{margin-top:10px;}
.cart-upsell-title{font-size:12px; font-weight:700; letter-spacing:.03em; margin-bottom:12px;}
.upsell-row{display:flex; gap:12px; align-items:center; padding:10px 0;}
.upsell-row .ph{width:56px; height:68px; aspect-ratio:auto; border-radius:2px;}
.upsell-row-name{font-size:12.5px; font-weight:600;}
.upsell-row-price{font-size:12px; color:var(--charcoal-soft);}
.upsell-add{margin-left:auto; font-size:11px; font-weight:700; border:1px solid var(--line); padding:6px 10px; border-radius:2px;}

/* ============ TOAST ============ */
.toast-wrap{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:1000; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{background:var(--charcoal); color:var(--ivory); font-size:13px; padding:13px 22px; border-radius:3px; opacity:0; transform:translateY(10px); transition:all .3s ease; box-shadow:0 8px 24px rgba(0,0,0,.18);}
.toast.show{opacity:1; transform:translateY(0);}

/* ============ SHOP PAGE ============ */
.shop-head{padding:40px 0 0;}
.shop-head h1{font-family:var(--serif); font-size:clamp(30px,4vw,46px); font-weight:500;}
.shop-head p{margin-top:8px; color:var(--charcoal-soft); font-size:14px;}
.shop-layout{display:grid; grid-template-columns:230px 1fr; gap:40px; padding:34px 0 100px;}
@media(max-width:900px){.shop-layout{grid-template-columns:1fr;}}
.filter-col{display:block;}
@media(max-width:900px){.filter-col{display:none;}}
.filter-group{margin-bottom:30px;}
.filter-group h4{font-size:11.5px; letter-spacing:.06em; font-weight:700; margin-bottom:14px; color:var(--charcoal);}
.filter-opt{display:flex; align-items:center; gap:9px; font-size:13px; margin-bottom:10px; color:var(--charcoal-soft); cursor:pointer;}
.filter-opt input{accent-color:var(--plum);}
.filter-opt.active{color:var(--charcoal); font-weight:600;}
.shop-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:26px; gap:10px; flex-wrap:wrap;}
.result-count{font-size:12.5px; color:var(--charcoal-soft);}
.sort-select{border:1px solid var(--line); background:var(--card); padding:9px 12px; font-size:12.5px; border-radius:2px;}
.mobile-filter-btn{display:none; border:1px solid var(--line); padding:9px 14px; font-size:12px; font-weight:600; border-radius:2px; background:var(--card);}
@media(max-width:900px){.mobile-filter-btn{display:inline-flex;}}
.filter-sheet{position:fixed; inset:0; background:var(--ivory); z-index:900; transform:translateY(100%); transition:transform .4s ease; overflow-y:auto; padding:22px;}
.filter-sheet.open{transform:translateY(0);}

/* ============ PRODUCT DETAIL ============ */
.pdp{padding:34px 0 100px;}
.breadcrumb{font-size:11.5px; color:var(--charcoal-soft); margin-bottom:22px;}
.breadcrumb a{text-decoration:underline;}
.pdp-grid{display:grid; grid-template-columns:1.1fr .9fr; gap:56px;}
@media(max-width:900px){.pdp-grid{grid-template-columns:1fr; gap:24px;}}
.pdp-gallery-main{border-radius:var(--radius-m); overflow:hidden;}
.pdp-thumbs{display:flex; gap:10px; margin-top:10px;}

<body>

<div id="app"></div>
<div id="overlay" class="overlay"></div>
<div id="cartDrawer" class="drawer"></div>
<div id="toastWrap" class="toast-wrap"></div>

<script>
/* =========================================================
   ZARIYA — single-file storefront + hidden admin
   Data persistence: window.storage (Claude artifact storage)
   Catalog = shared (all visitors see same products)
   Cart / wishlist = personal (per browser session var, not
   truly per-account since there's no login system)
========================================================= */

const STORE_KEY = "zariya:catalog:v1";
const ADMIN_HASH_KEY = "zariya:admin:passhash";
const ADMIN_SESSION_KEY = "zariya_admin_session"; // sessionStorage only, not window.storage

let hasWindowStorage = (typeof window.storage !== "undefined");

/* ---------- placeholder art (inline SVG, no external images) ---------- */
function earringSVG(seed){
  const variants = [
    `<svg viewBox="0 0 100 100"><circle cx="50" cy="18" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M50 25 L50 55" stroke="currentColor" stroke-width="2"/><circle cx="50" cy="70" r="16" stroke="currentColor" stroke-width="2" fill="none"/></svg>`,
    `<svg viewBox="0 0 100 100"><circle cx="50" cy="16" r="6" stroke="currentColor" stroke-width="2" fill="none"/><path d="M50 22 L50 40" stroke="currentColor" stroke-width="2"/><path d="M30 40 L70 40 L60 85 L40 85 Z" stroke="currentColor" stroke-width="2" fill="none"/></svg>`,
    `<svg viewBox="0 0 100 100"><circle cx="50" cy="20" r="6" stroke="currentColor" stroke-width="2" fill="none"/><path d="M50 26 L50 38" stroke="currentColor" stroke-width="2"/><path d="M50 38 C20 38 20 88 50 88 C80 88 80 38 50 38 Z" stroke="currentColor" stroke-width="2" fill="none"/></svg>`,
    `<svg viewBox="0 0 100 100"><circle cx="50" cy="18" r="6" stroke="currentColor" stroke-width="2" fill="none"/><path d="M50 24 L50 34" stroke="currentColor" stroke-width="2"/><polygon points="50,34 72,60 50,90 28,60" stroke="currentColor" stroke-width="2" fill="none"/></svg>`
  ];
  return variants[seed % variants.length];
}
function phBlock(seed, label){
  return `<div class="ph">${earringSVG(seed||0)}${label?`<span class="ph-label">${label}</span>`:''}</div>`;
}

/* ---------- seed catalog ---------- */
const SEED_PRODUCTS = [
  {id:"p1", name:"Moonlit Hoops", slug:"moonlit-hoops", price:499, compareAtPrice:699, category:"Hoops", style:"Minimal", occasion:"Everyday", giftFor:"For Her", mood:"minimal", material:"Gold-plated brass", size:"2.2cm diameter", description:"A quiet little hoop that catches light without trying too hard. Wear it Monday to Sunday.", badge:"BESTSELLER", stock:14, rating:4.8, reviews:32, images:[0,1]},
  {id:"p2", name:"Cherry Drop Studs", slug:"cherry-drop-studs", price:349, compareAtPrice:null, category:"Studs", style:"Romantic", occasion:"Date Night", giftFor:"For Her", mood:"romantic", material:"Alloy, enamel finish", size:"1.5cm drop", description:"Tiny cherries for the girl who still believes in little love stories.", badge:"NEW", stock:8, rating:4.9, reviews:21, images:[1,2]},
  {id:"p3", name:"Statement Shell Ear Cuffs", slug:"statement-shell-cuffs", price:599, compareAtPrice:849, category:"Cuffs", style:"Bold", occasion:"Party", giftFor:"For Your Girl", mood:"bold", material:"Brass, gold plated", size:"One size", description:"For when you walk in and the room notices. No piercing required.", badge:"LOW STOCK", stock:3, rating:4.7, reviews:15, images:[2,3]},
  {id:"p4", name:"Everyday Pearl Studs", slug:"everyday-pearl-studs", price:299, compareAtPrice:null, category:"Studs", style:"Soft Girl", occasion:"Everyday", giftFor:"For Her", mood:"soft", material:"Freshwater pearl, silver pin", size:"6mm pearl", description:"The pair you reach for without thinking. Soft, small, always right.", badge:"BESTSELLER", stock:22, rating:4.9, reviews:58, images:[3,0]},
  {id:"p5", name:"Little Heart Threaders", slug:"little-heart-threaders", price:379, compareAtPrice:null, category:"Threaders", style:"Romantic", occasion:"Anniversary", giftFor:"Just Because", mood:"romantic", material:"Gold-plated brass", size:"4cm chain", description:"A tiny heart that moves when you do. Says more than a long message.", badge:"NEW", stock:11, rating:4.6, reviews:9, images:[0,2]},
  {id:"p6", name:"Main Character Chandeliers", slug:"main-character-chandeliers", price:649, compareAtPrice:899, category:"Chandeliers", style:"Bold", occasion:"Party", giftFor:"For Her", mood:"main-character", material:"Alloy, cubic zirconia", size:"5cm drop", description:"Built for the night you want to be remembered in every photo.", badge:null, stock:6, rating:4.8, reviews:12, images:[1,3]},
  {id:"p7", name:"Sunday Gold Studs", slug:"sunday-gold-studs", price:249, compareAtPrice:null, category:"Studs", style:"Minimal", occasion:"Everyday", giftFor:"For Her", mood:"minimal", material:"Gold-plated brass", size:"0.8cm", description:"So small people will ask if you're even wearing earrings. You are.", badge:null, stock:30, rating:4.7, reviews:44, images:[2,1]},
  {id:"p8", name:"Just Because Huggies", slug:"just-because-huggies", price:329, compareAtPrice:null, category:"Huggies", style:"Soft Girl", occasion:"Gifting", giftFor:"Just Because", mood:"gift-giver", material:"Silver-plated brass", size:"1cm hoop", description:"The 'I saw this and thought of you' pair. Comes gift-ready.", badge:"NEW", stock:17, rating:5.0, reviews:6, images:[3,2]}
];

const MOODS = [
  {key:"soft", title:"The Soft Girl", sub:"for delicate everyday moments"},
  {key:"main-character", title:"The Main Character", sub:"for when you want to be noticed"},
  {key:"minimal", title:"The Minimal Girl", sub:"less, but better"},
  {key:"romantic", title:"The Romantic", sub:"for little love stories"},
  {key:"bold", title:"The Bold One", sub:"for making an entrance"},
  {key:"gift-giver", title:"The Gift Giver", sub:"for 'I saw this and thought of you'"}
];

/* ---------- state ---------- */
let PRODUCTS = [];
let cart = [];       // [{id, qty, giftWrap, giftNote}]
let wishlist = [];   // [id]
let currentGallery = 0;

/* ---------- storage helpers ---------- */
async function loadCatalog(){
  if(hasWindowStorage){
    try{
      const res = await window.storage.get(STORE_KEY, true);
      if(res && res.value){ PRODUCTS = JSON.parse(res.value); return; }
    }catch(e){ /* not found yet */ }
  }
  PRODUCTS = SEED_PRODUCTS.map(p=>({...p}));
  await saveCatalog();
}
async function saveCatalog(){
  if(hasWindowStorage){
    try{ await window.storage.set(STORE_KEY, JSON.stringify(PRODUCTS), true); }catch(e){ console.error(e); }
  }
}
async function loadCartWish(){
  if(hasWindowStorage){
    try{ const c = await window.storage.get("zariya:cart", false); if(c&&c.value) cart = JSON.parse(c.value); }catch(e){}
    try{ const w = await window.storage.get("zariya:wishlist", false); if(w&&w.value) wishlist = JSON.parse(w.value); }catch(e){}
  }
}
async function saveCart(){ if(hasWindowStorage){ try{ await window.storage.set("zariya:cart", JSON.stringify(cart), false);}catch(e){} } }
async function saveWishlist(){ if(hasWindowStorage){ try{ await window.storage.set("zariya:wishlist", JSON.stringify(wishlist), false);}catch(e){} } }

/* ---------- simple client-side hash (obfuscation, NOT real security) ---------- */
async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
const DEFAULT_ADMIN_PASSWORD = "zariya2026";

/* ---------- utils ---------- */
function money(n){ return "₹" + Number(n).toLocaleString("en-IN"); }
function stars(rating){ const full=Math.round(rating); return "★★★★★".slice(0,full)+"☆☆☆☆☆".slice(0,5-full); }
function findProduct(idOrSlug){ return PRODUCTS.find(p=>p.id===idOrSlug || p.slug===idOrSlug); }
function toast(msg){
  const wrap = document.getElementById("toastWrap");
  const t = document.createElement("div"); t.className="toast"; t.textContent = msg;
  wrap.appendChild(t);
  requestAnimationFrame(()=>t.classList.add("show"));
  setTimeout(()=>{ t.classList.remove("show"); setTimeout(()=>t.remove(),300); }, 2400);
}
function cartCount(){ return cart.reduce((s,l)=>s+l.qty,0); }
function cartSubtotal(){ return cart.reduce((s,l)=>{ const p=findProduct(l.id); return s + (p?p.price*l.qty:0); },0); }
const FREE_SHIP_THRESHOLD = 999;

/* ---------- routing ---------- */
function getRoute(){
  const h = location.hash.replace(/^#\/?/, "");
  const parts = h.split("/").filter(Boolean);
  return {name: parts[0]||"home", param: parts[1]||null};
}
window.addEventListener("hashchange", render);

/* ---------- cart / wishlist actions ---------- */
async function addToCart(id, qty=1, opts={}){
  const existing = cart.find(l=>l.id===id && !opts.giftWrap);
  if(existing && !opts.giftWrap){ existing.qty += qty; }
  else { cart.push({id, qty, giftWrap: !!opts.giftWrap, giftNote: opts.giftNote||""}); }
  await saveCart();
  toast("Added to your bag ♡");
  renderCartDrawer();
  openCartDrawer();
  updateHeaderCounts();
}
async function removeFromCart(idx){ cart.splice(idx,1); await saveCart(); renderCartDrawer(); updateHeaderCounts(); if(getRoute().name==="cart") render(); }
async function changeQty(idx, delta){ cart[idx].qty = Math.max(1, cart[idx].qty+delta); await saveCart(); renderCartDrawer(); updateHeaderCounts(); if(getRoute().name==="cart") render(); }
async function toggleWishlist(id){
  const i = wishlist.indexOf(id);
  if(i>-1){ wishlist.splice(i,1); toast("Removed from wishlist"); } else { wishlist.push(id); toast("Saved to wishlist ♡"); }
  await saveWishlist();
  updateHeaderCounts();
  document.querySelectorAll(`[data-wish-btn="${id}"]`).forEach(el=>el.classList.toggle("active", wishlist.includes(id)));
  if(getRoute().name==="wishlist") render();
}
function updateHeaderCounts(){
  const cc = document.getElementById("cartCount"); const wc = document.getElementById("wishCount");
  if(cc){ const n=cartCount(); cc.textContent=n; cc.style.display = n>0?"flex":"none"; }
  if(wc){ const n=wishlist.length; wc.textContent=n; wc.style.display = n>0?"flex":"none"; }
}

/* ---------- cart drawer ---------- */
function openCartDrawer(){ document.getElementById("cartDrawer").classList.add("open"); document.getElementById("overlay").classList.add("open"); }
function closeCartDrawer(){ document.getElementById("cartDrawer").classList.remove("open"); document.getElementById("overlay").classList.remove("open"); }
document.addEventListener("click", (e)=>{ if(e.target.id==="overlay"){ closeCartDrawer(); closeMobileMenu(); } });

function renderCartDrawer(){
  const el = document.getElementById("cartDrawer");
  const sub = cartSubtotal();
  const pct = Math.min(100, Math.round((sub/FREE_SHIP_THRESHOLD)*100));
  const remaining = Math.max(0, FREE_SHIP_THRESHOLD - sub);
  el.innerHTML = `
    <div class="drawer-head">
      <h3>Your Bag</h3>
      <button aria-label="Close bag" onclick="closeCartDrawer()">✕</button>
    </div>
    <div class="drawer-body">
      ${cart.length===0 ? `<div class="empty-state">Your bag is feeling light.<br>Let's fix that ♡</div>` : cart.map((line,idx)=>{
        const p = findProduct(line.id); if(!p) return "";
        return `<div class="cart-line">
          ${phBlock(p.images[0])}
          <div class="cart-line-info">
            <div>
              <div class="cart-line-name">${p.name}</div>
              <div class="cart-line-meta">${p.category}${line.giftWrap?' · Gift wrapped':''}</div>
            </div>
            <div class="cart-line-bottom">
              <div class="qty-stepper">
                <button onclick="changeQty(${idx},-1)">−</button><span>${line.qty}</span><button onclick="changeQty(${idx},1)">+</button>
              </div>
              <div style="font-size:13px;font-weight:700;">${money(p.price*line.qty)}</div>
            </div>
            <button class="cart-line-remove" onclick="removeFromCart(${idx})">Remove</button>
          </div>
        </div>`;
      }).join("")}
      ${cart.length>0 ? `<div class="cart-upsell">
        <div class="cart-upsell-title">Add a little more sparkle?</div>
        ${PRODUCTS.filter(p=>!cart.find(l=>l.id===p.id)).slice(0,2).map(p=>`
          <div class="upsell-row">
            ${phBlock(p.images[0])}
            <div><div class="upsell-row-name">${p.name}</div><div class="upsell-row-price">${money(p.price)}</div></div>
            <button class="upsell-add" onclick="addToCart('${p.id}')">Add</button>
          </div>`).join("")}
      </div>`:""}
    </div>
    ${cart.length>0?`<div class="drawer-foot">
      <div class="free-ship-bar"><div class="free-ship-bar-fill" style="width:${pct}%"></div></div>
      <div class="free-ship-note">${remaining>0?`Add ${money(remaining)} more for free shipping ✨`:`You've unlocked free shipping ✨`}</div>
      <div class="sum-row"><span>Subtotal</span><span>${money(sub)}</span></div>
      <div class="sum-row total"><span>Total</span><span>${money(sub)}</span></div>
      <a href="#/checkout" class="btn btn-primary btn-full" onclick="closeCartDrawer()" style="margin-top:14px;">CHECKOUT</a>
    </div>`:""}
  `;
}

/* ---------- header ---------- */
function renderHeader(active){
  return `
  <header class="site" id="siteHeader">
    <div class="wrap nav-row">
      <button class="hamburger" aria-label="Open menu" onclick="openMobileMenu()"><span></span><span></span><span></span></button>
      <a href="#/home" class="logo">ZARIYA</a>
      <nav class="nav-center">

  `;

function filterPanel(cats,occs,gifts){
  return `
    <div class="filter-group"><h4>CATEGORY</h4>${cats.map(c=>`<label class="filter-opt"><input type="radio" name="cat" ${shopFilters.category===c?'checked':''} onchange="shopFilters.category='${c}';renderShopGrid();">${c}</label>`).join("")}</div>
    <div class="filter-group"><h4>OCCASION</h4>${occs.map(c=>`<label class="filter-opt"><input type="radio" name="occ" ${shopFilters.occasion===c?'checked':''} onchange="shopFilters.occasion='${c}';renderShopGrid();">${c}</label>`).join("")}</div>
    <div class="filter-group"><h4>GIFT FOR</h4>${gifts.map(c=>`<label class="filter-opt"><input type="radio" name="gift" ${shopFilters.giftFor===c?'checked':''} onchange="shopFilters.giftFor='${c}';renderShopGrid();">${c}</label>`).join("")}</div>
    <div class="filter-group"><h4>PRICE</h4><input type="range" min="200" max="1000" value="${shopFilters.maxPrice}" oninput="shopFilters.maxPrice=this.value;renderShopGrid();" style="width:100%;accent-color:var(--plum);"><div style="font-size:12px;color:var(--charcoal-soft);">Up to ${money(shopFilters.maxPrice)}</div></div>
  `;
}
function openFilterSheet(){ document.getElementById("filterSheet").classList.add("open"); }
function closeFilterSheet(){ document.getElementById("filterSheet").classList.remove("open"); }
function renderShopGrid(newOnly){
  let list = PRODUCTS.filter(p=>{
    if(shopFilters.category!=="All" && p.category!==shopFilters.category) return false;
    if(shopFilters.occasion!=="All" && p.occasion!==shopFilters.occasion) return false;
    if(shopFilters.giftFor!=="All" && p.giftFor!==shopFilters.giftFor) return false;
    if(shopFilters.mood && p.mood!==shopFilters.mood) return false;
    if(newOnly==="new" && p.badge!=="NEW") return false;
    if(p.price>shopFilters.maxPrice) return false;
    return true;
  });
  if(shopFilters.sort==="price-low") list.sort((a,b)=>a.price-b.price);
  if(shopFilters.sort==="price-high") list.sort((a,b)=>b.price-a.price);
  if(shopFilters.sort==="bestselling") list.sort((a,b)=>b.reviews-a.reviews);
  if(shopFilters.sort==="newest") list = list.filter(p=>p.badge==="NEW").concat(list.filter(p=>p.badge!=="NEW"));
  const grid = document.getElementById("shopGrid");
  const count = document.getElementById("resultCount");
  if(grid) grid.innerHTML = list.length ? list.map(productCard).join("") : `<div class="empty-state">No pairs match yet — try widening your filters.</div>`;
  if(count) count.textContent = `${list.length} pieces`;
}

function pdpChangeQty(delta){
  const el = document.getElementById("pdpQtyStepper");
  let q = Math.max(1, parseInt(el.dataset.qty)+delta);
  el.dataset.qty = q;
  document.getElementById("pdpQty").textContent = q;
}
function pdpAddToBag(id){
  const qty = parseInt(document.getElementById("pdpQtyStepper").dataset.qty);
  const giftWrap = document.getElementById("pdpGiftWrap").checked;
  const giftNote = document.getElementById("pdpGiftNote").value;
  addToCart(id, qty, {giftWrap, giftNote});
}

async function getAdminHash(){
  if(hasWindowStorage){
    try{ const r = await window.storage.get(ADMIN_HASH_KEY, true); if(r&&r.value) return r.value; }catch(e){}
  }
  return await sha256(DEFAULT_ADMIN_PASSWORD);
}
function isAdminUnlocked(){ return sessionStorage.getItem(ADMIN_SESSION_KEY)==="1"; }

  return `<div class="admin-gate">

      <button class="btn btn-primary btn-full" onclick="adminLogin()">ENTER</button>
      <div id="adminGateErr" style="color:#a13b3b;font-size:12.5px;margin-top:10px;"></div>
      <a href="#/home" style="display:block;margin-top:18px;font-size:12px;color:var(--charcoal-soft);text-decoration:underline;">← Back to store</a>
    </div>
  </div>`;
}
async function adminLogin(){
  const val = document.getElementById("adminPass").value;
  const hash = await sha256(val);
  const stored = await getAdminHash();
  if(hash===stored){ sessionStorage.setItem(ADMIN_SESSION_KEY,"1"); render(); }
  else{ document.getElementById("adminGateErr").textContent = "Incorrect password."; }
}
function adminLogout(){ sessionStorage.removeItem(ADMIN_SESSION_KEY); location.hash="#/home"; }

function closeAdminModal(){ const m = document.getElementById("adminModalBg"); if(m) m.remove(); }
async function saveAdminProduct(){
  const name = document.getElementById("fName").value.trim();
  const price = parseFloat(document.getElementById("fPrice").value)||0;
  if(!name || !price){ toast("Name and price are required"); return; }
  const data = {
    name,
    slug: name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''),
    price,
    compareAtPrice: document.getElementById("fCompare").value ? parseFloat(document.getElementById("fCompare").value) : null,
    category: document.getElementById("fCategory").value.trim()||"Earrings",
    style: document.getElementById("fStyle").value.trim(),
    occasion: document.getElementById("fOccasion").value.trim()||"Everyday",
    giftFor: document.getElementById("fGiftFor").value.trim()||"For Her",
    mood: document.getElementById("fMood").value,
    description: document.getElementById("fDesc").value.trim(),
    material: document.getElementById("fMaterial").value.trim(),
    size: document.getElementById("fSize").value.trim(),
    stock: parseInt(document.getElementById("fStock").value)||0,
    badge: document.getElementById("fBadge").value || null,
    images: [parseInt(document.getElementById("fImage").value), parseInt(document.getElementById("fImage").value)],
    rating: 5, reviews: 0
  };
  if(editingProductId){
    const idx = PRODUCTS.findIndex(p=>p.id===editingProductId);
    PRODUCTS[idx] = {...PRODUCTS[idx], ...data};
  } else {
    data.id = "p"+Date.now();
    data.rating = 5; data.reviews = 0;
    PRODUCTS.push(data);
  }
  await saveCatalog();
  closeAdminModal();
  toast(editingProductId?"Product updated":"Product added");
  render();
}
async function adminDeleteProduct(id){
  if(!confirm("Remove this product from the store? This cannot be undone.")) return;
  PRODUCTS = PRODUCTS.filter(p=>p.id!==id);
  await saveCatalog();
  toast("Product removed");
  render();
}
function openAdminPasswordModal(){
  const modalBg = document.createElement("div");
  modalBg.className="admin-modal-bg"; modalBg.id="adminModalBg";
  modalBg.innerHTML = `<div class="admin-modal" style="max-width:420px;">
    <h3>Change admin password</h3>
    <div class="admin-field"><label>New password</label><input type="password" id="fNewPass"></div>
    <div class="admin-field"><label>Confirm new password</label><input type="password" id="fNewPass2"></div>
    <div class="admin-modal-actions">
      <button class="btn btn-ghost" onclick="closeAdminModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveAdminPassword()">Save</button>
    </div>
  </div>`;
  document.body.appendChild(modalBg);
}
async function saveAdminPassword(){
  const p1 = document.getElementById("fNewPass").value;
  const p2 = document.getElementById("fNewPass2").value;
  if(p1.length<6){ toast("Use at least 6 characters"); return; }
  if(p1!==p2){ toast("Passwords don't match"); return; }
  const hash = await sha256(p1);
  if(hasWindowStorage){ try{ await window.storage.set(ADMIN_HASH_KEY, hash, true); }catch(e){} }
  closeAdminModal();
  toast("Password updated");
}

/* ---------- MAIN RENDER ---------- */
function render(){
  const {name, param} = getRoute();
  const app = document.getElementById("app");
  window.scrollTo(0,0);

  if(name==="zariya-admin-9k2"){
    if(!isAdminUnlocked()){
      tplAdminGate().then(html=>{ app.innerHTML = html; });
    } else {
      app.innerHTML = tplAdminDashboard();
    }
    return;
  }

  let html = "";
  switch(name){
    case "home": html = tplHome(); break;
    case "shop": html = tplShop(param); break;
    case "gifting": html = tplGifting(); break;
    case "moods": html = tplMoods(); break;
    case "product": html = tplProduct(param); break;
    case "cart": html = tplCartPage(); break;
    case "wishlist": html = tplWishlist(); break;
    case "checkout": html = tplCheckout(); break;
    case "order-confirmed": html = tplConfirm(); break;
    case "about": html = tplAbout(); break;
    case "contact": html = tplContact(); break;
    default: html = tplHome();
  }
  app.innerHTML = html;
  updateHeaderCounts();
  renderCartDrawer();
  onScrollHeader();

  if(name==="shop") renderShopGrid(param==="new"?"new":"");

  // hero reveal animation (single orchestrated entrance, not per-card)
  requestAnimationFrame(()=>{
    const c = document.getElementById("heroCopy"), v = document.getElementById("heroVisual");
    if(c){ setTimeout(()=>c.classList.add("in"),60); }
    if(v){ setTimeout(()=>v.classList.add("in"),220); }
  });
}

/* ---------- init ---------- */
(async function init(){
  await loadCatalog();
  await loadCartWish();
  if(!location.hash) location.hash = "#/home";
  render();
})();
